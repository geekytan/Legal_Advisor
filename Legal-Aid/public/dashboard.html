<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0e1b2f" />
<title>Legal Aid Advisor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e1b2f'/><text x='50' y='70' font-size='58' text-anchor='middle'>⚖️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ── App header ── -->
<header class="app-header">
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="brand">
    <div class="logo-mark">LA</div>
    <div>
      <div class="app-title">Legal Aid Advisor</div>
      <div class="app-sub">IBM watsonx Orchestrate</div>
    </div>
  </div>
  <div class="header-right">
    <a class="home-link" href="/" aria-label="Back to landing page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <span class="session-chip" id="headerSessionLabel">No active session</span>
    <div class="status-pill" id="statusPill">Connecting…</div>
  </div>
</header>

<!-- ── Sidebar nav ── -->
<nav class="app-nav" id="appNav">
  <div class="nav-section-label">Workspace</div>

  <button class="nav-item active" data-view="chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Chat
  </button>

  <button class="nav-item" data-view="analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Analytics
  </button>

  <button class="nav-item" data-view="contracts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    Contract Review
  </button>

  <button class="nav-item" data-view="sessions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Session History
  </button>

  <div class="nav-divider"></div>
  <div class="nav-section-label">System</div>

  <button class="nav-item" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>

  <div class="nav-footer" id="navSessionLabel">No session started yet</div>
</nav>

<!-- ── Main content ── -->
<main class="app-main" id="appMain">

  <!-- ── VIEW: Chat ── -->
  <div class="view active" id="view-chat"></div>

  <!-- ── VIEW: Analytics ── -->
  <div class="view" id="view-analytics"></div>

  <!-- ── VIEW: Contracts ── -->
  <div class="view" id="view-contracts"></div>

  <!-- ── VIEW: Sessions ── -->
  <div class="view" id="view-sessions"></div>

  <!-- ── VIEW: Settings ── -->
  <div class="view" id="view-settings"></div>

</main>

<!-- ── Toast container ── -->
<div id="toast-container"></div>

<!-- ── Scripts ── -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/contracts.js"></script>
<script src="js/views/sessions.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
